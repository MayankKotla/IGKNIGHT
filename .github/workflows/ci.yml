name: CI/CD

# Runs on every push and pull request against main. The `test` job is the
# safety gate: it always runs and installs/tests/builds both workspaces.
# The `deploy-server` job only runs after `test` passes AND only on a push
# to main (never on a PR, and never if tests failed) — so a broken commit
# can reach GitHub but can never reach production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 doesn't have a native WebSocket (needed by Supabase's
          # Realtime client, constructed at require-time by several server
          # modules) and its jsdom/undici versions need util.webidl APIs
          # that only landed in newer Node — both broke client/server tests
          # here even though they passed locally. Node 22 has both; also
          # matches what Render runs by default in production.
          node-version: 22
          cache: npm

      # Installs both workspaces (client + server) from the root lockfile.
      - name: Install dependencies
        run: npm ci

      # Reports known-vulnerable dependencies on every run so a new
      # high/critical advisory doesn't go unnoticed. continue-on-error
      # instead of failing the build — a moderate advisory in a dev-only
      # tool shouldn't block a deploy, this is for visibility, not a gate.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run server tests
        run: npm run test:server

      - name: Run client tests
        run: npm run test:client

      # Catches build-breaking errors (bad imports, syntax issues, etc.)
      # before they can reach Vercel's own build step.
      - name: Build client
        run: npm run build:client

  deploy-server:
    name: Deploy server (Render)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Render's own "auto-deploy on push" is intentionally left OFF for
      # this service — see README's Deployment section. Instead, this step
      # hits the service's Deploy Hook URL directly, so a deploy can only
      # ever be triggered by a push to main that has already passed the
      # `test` job above.
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set yet — skipping deploy trigger."
            echo "See README's Deployment section to finish Render setup."
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # The client (Vercel) is not deployed from this workflow. Vercel's own
  # GitHub integration builds and deploys it directly on push to main, and
  # creates a preview deployment for every pull request — see README's
  # Deployment section for one-time setup.
